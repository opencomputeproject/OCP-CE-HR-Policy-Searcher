# Live probes: the tests marked `live` ask the public internet something on
# purpose (today: that the Virginia LIS store still serves the file names the
# source expects). Every ordinary run - pre-push, CI, a contributor's `pytest`
# - collects them and skips them, so none of those depends on a remote server
# being up. This workflow is the one place they execute: every Monday, and by
# hand from the Actions tab. Run locally with `pytest -q -m live --live`.
#
# Action references are pinned to full commit SHAs (supply-chain hygiene);
# the trailing comment records the tag each SHA corresponds to.

name: Live Probes

on:
  schedule:
    # 06:15 UTC every Monday, before the weekly signals sweep
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-probes
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browser]" -c constraints.txt

      - name: Live tests
        run: pytest -q -m live --live
